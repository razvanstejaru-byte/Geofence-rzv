name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: |
          unzip -q proiect.zip -d src
          cd src && gradle assembleDebug --no-daemon
      - run: |
          cp src/app/build/outputs/apk/debug/app-debug.apk GeoAlert.apk
          gh release create "v${{ github.run_number }}" GeoAlert.apk --title "GeoAlert ${{ github.run_number }}"
        env:
          GH_TOKEN: ${{ github.token }}
